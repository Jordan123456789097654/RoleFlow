<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>RoleFlow v2 — Launch Trailer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--f-sans:"Instrument Sans",Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--f-disp:Fraunces,Georgia,"Times New Roman",serif;--f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
/* real RoleFlow dark-theme tokens (globals.css) */
--paper:#090a0f;--surface:#10121a;--sunk:#0c0d14;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--ink:#f1f3f9;--ink2:#c5cbd9;--muted:#8890a4;--faint:#555c70;--accent:#8b5cf6;--accent-soft:rgba(139,92,246,.15);--accent-ink:#ddd6fe;--moss:#10b981;--moss-soft:rgba(16,185,129,.15);--moss-ink:#6ee7b7;--gold:#f59e0b;--gold-soft:rgba(245,158,11,.15);--danger:#ef4444;--danger-soft:rgba(239,68,68,.15)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;color:var(--ink);font-family:var(--f-sans)}
body.playing{cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;background:#050409;transform-origin:center}
.layer{position:absolute;inset:0;pointer-events:none}
#grid{background-image:linear-gradient(to right,rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000 40%,transparent 100%);mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000 40%,transparent 100%);animation:gridDrift 12s linear infinite}
@keyframes gridDrift{to{background-position:64px 64px}}
.glow{position:absolute;width:1400px;height:1100px;border-radius:50%;filter:blur(140px);opacity:.42;transition:background 1.4s ease,opacity .6s}
#g1{left:-300px;top:-420px;animation:drift1 9s ease-in-out infinite alternate}
#g2{right:-340px;bottom:-480px;animation:drift2 11s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(160px,90px) scale(1.12)}}
@keyframes drift2{to{transform:translate(-140px,-70px) scale(1.08)}}
#scene{position:absolute;inset:0}
.cam{position:absolute;inset:0;transform-origin:var(--ox,50%) var(--oy,50%);animation:camin .4s ease-out both,camz var(--dur,4s) linear both}
@keyframes camin{from{opacity:0;filter:blur(10px)}to{opacity:1;filter:none}}
@keyframes camz{from{transform:scale(1)}to{transform:scale(var(--zm,1.05))}}
#vig{background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65) 100%)}
#scan{background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px);mix-blend-mode:overlay}
#flash{background:radial-gradient(circle at center,#fff 0%,rgba(221,214,254,.85) 35%,transparent 75%);opacity:0}
#flash.go{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:.98}100%{opacity:0}}
#whiteout{background:#f4f1ea;opacity:0;transition:opacity .2s}

/* ----- primitives ----- */
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:26px;padding:0 120px}
.abs{position:absolute}
.serif{font-family:var(--f-disp);font-style:italic;font-weight:400}
.mono{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.3em}
.s-dim{font-size:60px;color:#94a3b8;font-weight:500}
.s-white{font-size:76px;color:#fff;font-weight:700;letter-spacing:-.02em}
.s-serif{font-size:84px;color:#e2e8f0}
.s-big{font-size:150px;font-weight:900;letter-spacing:-.04em;color:#fff;line-height:1}
.s-huge{font-size:230px;font-weight:900;letter-spacing:-.05em;line-height:.95}
.disp{font-family:var(--f-disp);font-weight:400;letter-spacing:-.02em;line-height:1.02}
.disp i{color:var(--accent);font-style:italic}
.sub{font-size:34px;color:#a78bfa;font-weight:500}
.sub.dim{color:#94a3b8}
.grad{background:linear-gradient(90deg,#fff 0%,#ddd6fe 40%,#8b5cf6 70%,#fff 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 3.2s linear infinite}
@keyframes shim{to{background-position:-220% 0}}
.crim{color:#fb7185}.viol{color:#a78bfa}.emer{color:#6ee7b7}.amber{color:#fbbf24}.fuch{color:#e879f9}.sky{color:#38bdf8}
.ty.typing::after{content:"";display:inline-block;width:.09em;height:.95em;margin-left:.08em;background:currentColor;vertical-align:-.12em;animation:blink .6s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.in{opacity:0;animation:inup .55s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes inup{from{opacity:0;transform:translateY(26px) scale(.985)}to{opacity:1;transform:none}}
.pop{opacity:0;animation:pop .45s cubic-bezier(.2,1.4,.3,1) forwards;animation-delay:var(--d,0s)}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.tilt{opacity:0;animation:tilt .95s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes tilt{from{opacity:0;transform:perspective(2400px) rotateY(-12deg) rotateX(5deg) translateY(70px) scale(.93)}to{opacity:1;transform:perspective(2400px)}}
.slide-l{opacity:0;animation:sl .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes sl{from{opacity:0;transform:translateX(-80px)}to{opacity:1;transform:none}}
.out{animation:fadeout .4s ease forwards;animation-delay:var(--d,0s)}
@keyframes fadeout{to{opacity:0}}
.glitch{animation:glitch .22s steps(2) infinite}
@keyframes glitch{0%{transform:translate(0)}25%{transform:translate(-6px,2px);text-shadow:4px 0 #f43f5e,-4px 0 #38bdf8}50%{transform:translate(5px,-3px)}75%{transform:translate(-3px,0);text-shadow:-4px 0 #f43f5e,4px 0 #38bdf8}100%{transform:none}}
.row{display:flex;align-items:center}
.logo{filter:drop-shadow(0 0 60px rgba(139,92,246,.55))}
.cursor{position:absolute;width:44px;height:44px;z-index:30;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}

/* ----- browser window ----- */
.win{position:absolute;border-radius:20px;overflow:hidden;background:var(--paper);border:1px solid var(--line2);box-shadow:0 50px 160px rgba(0,0,0,.75),0 0 140px rgba(139,92,246,.22)}
.wbar{height:54px;display:flex;align-items:center;gap:9px;padding:0 22px;background:#0c0d14;border-bottom:1px solid var(--line)}
.wbar i{width:13px;height:13px;border-radius:50%;background:#2a2d3a}
.wbar .url{margin-left:20px;flex:1;max-width:560px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 16px;font:500 17px var(--f-mono);color:var(--muted)}
.wbar .url b{color:var(--ink2);font-weight:500}
.wbody{position:relative;overflow:hidden}
.u{zoom:var(--z,1)}

/* ----- real RoleFlow UI (globals.css, dark) ----- */
.u-card{border-radius:12px;border:1px solid var(--line);background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.5)}
.u-eyebrow{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
.u-chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);padding:2px 10px;font:400 11px var(--f-mono);color:var(--ink2)}
.u-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:8px;border:1px solid;font:500 14px var(--f-sans);white-space:nowrap;position:relative}
.u-btn.lg{min-height:48px;padding:0 24px;font-size:15px}.u-btn.sm{min-height:32px;padding:4px 12px;font-size:13px}
.u-pri{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.u-ghost{background:var(--surface);border-color:var(--line2);color:var(--ink)}
.u-moss{background:var(--moss);border-color:var(--moss);color:#fff}
.u-dang{background:transparent;border-color:var(--danger);color:var(--danger)}
.u-field{display:flex;align-items:center;height:48px;width:100%;border-radius:8px;border:1px solid var(--line);background:var(--sunk);padding:0 14px 0 40px;font:400 15px var(--f-sans);color:var(--muted);position:relative}
.u-badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font:500 11px var(--f-mono);border:1px solid var(--line)}
.b-moss{background:var(--moss-soft);color:var(--moss-ink);border-color:rgba(16,185,129,.3)}
.b-gold{background:var(--gold-soft);color:#fbbf24;border-color:rgba(245,158,11,.3)}
.b-cyan{background:rgba(6,182,212,.1);color:#67e8f9;border-color:rgba(6,182,212,.3)}
.b-dang{background:var(--danger-soft);color:#fca5a5;border-color:rgba(239,68,68,.35)}
.b-acc{background:var(--accent-soft);color:var(--accent-ink);border-color:rgba(139,92,246,.3)}
.b-neu{background:var(--sunk);color:var(--ink2)}
.b-fuch{background:rgba(217,70,239,.12);color:#f0abfc;border-color:rgba(217,70,239,.4)}
.pulse{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3;transform:scale(.7)}}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 14px var(--f-sans);color:#fff}
.u-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;border-bottom:1px solid var(--line);background:rgba(9,10,15,.9)}
.u-nav a{font:500 14px var(--f-sans);color:var(--muted);margin-left:26px}
/* rankhub dark panels */
.rh{border-radius:16px;border:1px solid rgba(255,255,255,.1);background:#090b10;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.rh-sub{font-size:12px;color:#94a3b8}
.tabs{display:flex;gap:8px;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:12px}
.tab{padding:8px 16px;border-radius:12px;font:600 12px var(--f-sans);color:#94a3b8;border:1px solid transparent}
.tab.on{background:rgba(6,182,212,.2);color:#67e8f9;border-color:rgba(6,182,212,.4)}
.tr{display:flex;align-items:center;gap:16px;padding:11px 16px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);margin-bottom:8px;font-size:13px}
.th{display:flex;gap:16px;padding:0 16px 8px;font:600 10px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:#64748b}
.rung{display:flex;align-items:center;gap:14px;padding:10px 14px;margin-bottom:7px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);font-size:13px;transition:all .3s}
.rung b{font:700 13px var(--f-mono);width:46px;color:#e879f9}
.rung span.n{color:#e2e8f0;font-weight:600;flex:1}
.rung em{font:500 10px var(--f-mono);font-style:normal;color:#64748b}
.rung.prot{border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.06)}
.rung.prot b{color:#fbbf24}
.rung.lit{background:rgba(217,70,239,.2);border-color:#e879f9;box-shadow:0 0 30px rgba(217,70,239,.45)}
.rung.red{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.1)}
.rung.red b{color:#fca5a5}

/* ----- start screen ----- */
#start{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:#050409;color:#fff;text-align:center;transition:opacity .5s}
#start img{width:640px}
#playBtn{font:700 30px/1 inherit;font-family:inherit;color:#fff;background:#7c3aed;border:0;border-radius:18px;padding:26px 56px;cursor:pointer;box-shadow:0 10px 60px rgba(139,92,246,.55);transition:transform .15s,background .15s}
#playBtn:hover{transform:scale(1.04);background:#8b5cf6}
#start p{max-width:880px;color:#94a3b8;font-size:20px;line-height:1.6}
#start kbd{font-family:ui-monospace,monospace;background:rgba(255,255,255,.08);padding:2px 9px;border-radius:6px;color:#ddd6fe}
#count{position:absolute;inset:0;z-index:90;display:none;align-items:center;justify-content:center;font-size:360px;font-weight:900;color:rgba(255,255,255,.9);background:#050409}
#end{position:absolute;inset:0;z-index:95;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:#000}
#hint{position:absolute;left:0;right:0;bottom:18px;text-align:center;font:600 13px ui-monospace,monospace;letter-spacing:.2em;color:#475569;z-index:120;transition:opacity .4s}
@keyframes scrollup{to{transform:translateY(-55%)}}@keyframes mq{to{transform:translateX(-50%)}}@keyframes fillbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes flyin{to{transform:none;opacity:1}}@keyframes strike{to{transform:scaleX(1)}}@keyframes merge1{to{left:280px}}@keyframes merge2{to{left:280px}}
@keyframes pagescroll{from{transform:translateY(0)}to{transform:translateY(var(--sy,-560px))}}
@keyframes moveCard{0%{transform:translateX(0)}30%{transform:translateX(404px)}45%{transform:translateX(404px)}75%{transform:translateX(808px)}85%{transform:translateX(808px)}100%{transform:translateX(1212px)}}
@keyframes dash{to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ring{from{transform:scale(.4);opacity:.9}to{transform:scale(2.4);opacity:0}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="grid"></div>
  <div class="glow" id="g1"></div><div class="glow" id="g2"></div>
  <div class="layer" id="whiteout"></div>
  <div id="scene"></div>
  <div class="layer" id="vig"></div><div class="layer" id="scan"></div>
  <div class="layer" id="flash"></div>
  <div id="count"></div>
  <div id="end">
    <img src="logo-pack/roleflow-lockup-dark-transparent.png" width="560" alt="RoleFlow">
    <button id="replayBtn" style="font:700 26px inherit;font-family:inherit;color:#fff;background:#7c3aed;border:0;border-radius:16px;padding:20px 44px;cursor:pointer">↻ Replay</button>
  </div>
  <div id="start">
    <img src="logo-pack/roleflow-lockup-dark-transparent.png" alt="RoleFlow">
    <button id="playBtn">▶&nbsp; Play trailer</button>
    <p>Click once. The page goes fullscreen, counts down 3&ndash;2&ndash;1, then plays the whole 75-second trailer by itself &mdash; picture, music and sound effects. Start your screen recorder (with system audio on) before you click.
    <br>Shortcuts: <kbd>Esc</kbd> stop &nbsp;·&nbsp; <kbd>M</kbd> mute &nbsp;·&nbsp; <kbd>?t=30</kbd> in the URL jumps to 0:30 (silent preview).</p>
  </div>
</div>
<div id="hint"></div>

<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s);
const stage=$('#stage'),scene=$('#scene'),g1=$('#g1'),g2=$('#g2');
const Q=new URLSearchParams(location.search);
const SEEK=parseFloat(Q.get('t')||'0')||0, MUTE=Q.get('mute')==='1'||SEEK>0, AUTO=Q.get('auto')==='1';
const TOTAL=76;

/* ---------- scale stage to window ---------- */
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();

/* ================================================================= AUDIO */
let AC=null,master=null,music=null,sfx=null,NB=null,muted=MUTE;
function initAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=muted?0:.9;
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.attack.value=.004;comp.release.value=.2;
  music=AC.createGain();sfx=AC.createGain();music.gain.value=.8;sfx.gain.value=1;
  music.connect(comp);sfx.connect(comp);comp.connect(master);master.connect(AC.destination);
  NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
const hz=n=>440*Math.pow(2,(n-69)/12);
function env(g,t,a,peak,dur,rel){g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(peak,.0002),t+a);g.gain.setValueAtTime(Math.max(peak,.0002),t+Math.max(a,dur-rel));g.gain.exponentialRampToValueAtTime(.0001,t+dur)}
function osc(type,f,t,dur,peak,o={}){
  const os=AC.createOscillator(),g=AC.createGain();os.type=type;os.frequency.setValueAtTime(f,t);
  if(o.f2)os.frequency.exponentialRampToValueAtTime(o.f2,t+(o.fd||dur));
  if(o.det)os.detune.value=o.det;
  let n=os;
  if(o.lp){const l=AC.createBiquadFilter();l.type='lowpass';l.frequency.setValueAtTime(o.lp,t);if(o.lp2)l.frequency.exponentialRampToValueAtTime(o.lp2,t+dur);l.Q.value=o.q||.7;os.connect(l);n=l}
  n.connect(g);g.connect(o.dest||music);env(g,t,o.a||.005,peak,dur,o.r||dur*.6);os.start(t);os.stop(t+dur+.05);return g}
function noise(t,dur,peak,o={}){
  const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const f=AC.createBiquadFilter();f.type=o.type||'bandpass';
  f.frequency.setValueAtTime(o.f||2000,t);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+dur);f.Q.value=o.q||1;
  const g=AC.createGain();s.connect(f);f.connect(g);g.connect(o.dest||sfx);
  if(o.swell){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+dur*.97);g.gain.linearRampToValueAtTime(0,t+dur)}else env(g,t,o.a||.003,peak,dur,dur*.9);
  s.start(t,Math.random());s.stop(t+dur+.05)}
const kick=(t,v=1)=>{osc('sine',150,t,.34,.95*v,{f2:42,fd:.16,dest:music,a:.002,r:.3});noise(t,.03,.25*v,{type:'highpass',f:3000,dest:music})};
const snare=(t,v=1)=>{noise(t,.2,.5*v,{type:'bandpass',f:1900,q:.7,dest:music});osc('triangle',210,t,.13,.35*v,{f2:130,dest:music})};
const hat=(t,v=1)=>noise(t,.05,.12*v,{type:'highpass',f:7500,dest:music});
const bass=(t,n,d,v=1)=>osc('sawtooth',hz(n),t,d,.34*v,{lp:420,lp2:160,q:3,dest:music});
const pluck=(t,n,v=1)=>osc('triangle',hz(n),t,.45,.22*v,{lp:2800,lp2:500,dest:music});
function pad(t,notes,dur,v=1,sup=false){notes.forEach(n=>{[-9,0,9].forEach(c=>osc('sawtooth',hz(n),t,dur,(sup?.05:.035)*v,{det:c,lp:sup?3200:1500,lp2:sup?1200:600,a:sup?.04:.4,r:dur*.5,dest:music}))})}
/* sfx */
const clickAt=(t,v=1)=>{noise(t,.018,.22*v,{type:'bandpass',f:3200+Math.random()*900,q:3});osc('square',900+Math.random()*120,t,.016,.05*v,{lp:2400})};
const whoosh=(t,d=.5,up=true,v=.5)=>noise(t,d,v,{f:up?300:5000,f2:up?6000:300,q:.9,swell:up});
const thunk=t=>{osc('sine',180,t,.12,.5,{f2:70,dest:sfx});noise(t,.03,.2,{type:'lowpass',f:1200})};
const bell=(t,v=1,f=1320)=>{osc('sine',f,t,.5,.12*v,{dest:sfx});osc('sine',f*2.01,t,.3,.04*v,{dest:sfx})};
const chime=(t,semi=0,v=1)=>[0,4,7].forEach((s,i)=>osc('sine',hz(76+semi+s),t+i*.045,.5,.13*v,{dest:sfx,a:.004}));
const ping=(t,f=1100,v=1)=>{osc('sine',f,t,.28,.14*v,{dest:sfx});osc('sine',f*1.5,t+.07,.22,.08*v,{dest:sfx})};
const stutter=(t,v=1)=>{for(let i=0;i<5;i++)osc('sawtooth',90+Math.random()*400,t+i*.034,.03,.18*v,{lp:2000,dest:sfx})};
const buzz=(t,d=.4)=>osc('sawtooth',74,t,d,.3,{lp:900,dest:sfx,det:20});
const latch=t=>{osc('square',2400,t,.025,.12,{lp:3500,dest:sfx});osc('sine',110,t+.02,.18,.45,{f2:55,dest:sfx})};
const shield=(t,d=1.6)=>{osc('sine',55,t,d,.5,{dest:sfx,a:.8,r:.6});osc('sine',110,t,d,.22,{dest:sfx,det:14,a:.8,r:.6});osc('sine',111.5,t,d,.18,{dest:sfx,a:.8,r:.6})};
const alarm=t=>[0,.5].forEach(o=>osc('sawtooth',196,t+o,.28,.16,{lp:700,dest:sfx}));
const tick=t=>{noise(t,.012,.3,{type:'highpass',f:2500});osc('sine',1800,t,.02,.1,{dest:sfx})};
const shutter=t=>{noise(t,.04,.35,{type:'bandpass',f:4200,q:2});noise(t+.07,.05,.25,{type:'bandpass',f:2600,q:2})};

 <div class="s-huge" style="font-size:230px"><span class="grad">${TY('RoleFlow v2','',150,12,0)}</span></div>
 <div class="mono emer pop" style="--d:1.3s;font-size:34px;color:#6ee7b7;letter-spacing:.5em">Live today</div>
 <div class="row in" style="--d:1.6s;gap:50px">${['apply','rank','roster'].map(k=>`<img src="${IMG[k]}" style="height:64px">`).join('')}</div>
 <div style="font:48px ui-monospace,Menlo,monospace;color:#c4b5fd">${TY('roleflow.site','',2200,16)}</div>
 <div class="serif" style="font-size:60px;color:#f1f5f9;opacity:0;animation:inup .6s ease 3.3s forwards" id="rdy">Ready when you are.</div></div>`,
 ()=>{flash();after(4200,()=>{const r=$('#rdy');if(r)r.classList.add('glitch')});after(4700,()=>{scene.style.transition='opacity .6s';scene.style.opacity=0})});

/* ================================================================= PLAYER */
let TOKENnow=0,raf=0,startPerf=0,playing=false,cur=-1;
function show(i){
  const sc=S[i];TOKEN++;TOKENnow=TOKEN;cur=i;
  scene.style.transition='none';scene.style.opacity=1;
  const wo=$('#whiteout');wo.style.transition='none';wo.style.opacity=0;
  const nx=S[i+1]?S[i+1].t:TOTAL;scene.innerHTML=`<div class="cam" style="--dur:${(nx-sc.t+.6).toFixed(1)}s;--zm:${sc.zm||1.05};--ox:${sc.ox||'50%'};--oy:${sc.oy||'50%'}">${sc.html}</div>`;glow(...sc.gl,sc.light?.25:.42);
  flash_if(i);runTyping(scene);if(sc.run)sc.run();
}
function flash_if(i){if([7,8].includes(i)&&false)flash()}
function tickLoop(){
  const now=(performance.now()-startPerf)/1000+SEEK;
  let idx=-1;for(let i=0;i<S.length;i++)if(S[i].t<=now)idx=i;
  if(idx!==cur&&idx>=0)show(idx);
  if(now>=TOTAL){finish();return}
  raf=requestAnimationFrame(tickLoop);
}
function finish(){
  playing=false;document.body.classList.remove('playing');scene.innerHTML='';
  $('#end').style.display='flex';$('#hint').style.opacity=1;$('#hint').textContent='';
}
function stopAll(){cancelAnimationFrame(raf);TOKEN++;playing=false;document.body.classList.remove('playing');if(AC){try{AC.close()}catch(e){}AC=null}scene.innerHTML='';$('#whiteout').style.opacity=0;scene.style.opacity=1}
async function begin(){
  $('#start').style.display='none';$('#end').style.display='none';
  if(!MUTE||!AC){if(!AC)initAudio()}
  if(AC&&AC.state==='suspended')await AC.resume();
  if(!Q.get('nofs')&&!AUTO){try{await stage.parentElement.requestFullscreen?.()||document.documentElement.requestFullscreen()}catch(e){try{await document.documentElement.requestFullscreen()}catch(_){}}}
  document.body.classList.add('playing');$('#hint').style.opacity=0;
  if(!AUTO&&SEEK===0){
    const c=$('#count');c.style.display='flex';
    for(const n of ['3','2','1']){c.textContent=n;if(AC&&!muted)tick(AC.currentTime+.01);await new Promise(r=>setTimeout(r,1000))}
    c.style.display='none';
  }
  playing=true;cur=-1;
  const lead=.2;
  if(AC&&SEEK===0){scheduleAudio(AC.currentTime+lead)}
  startPerf=performance.now()+lead*1000;
  cancelAnimationFrame(raf);raf=requestAnimationFrame(tickLoop);
}
$('#playBtn').addEventListener('click',begin);
$('#replayBtn').addEventListener('click',()=>{stopAll();begin()});
addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(playing||$('#end').style.display==='flex'){stopAll();$('#end').style.display='none';$('#start').style.display='flex'}}
  if(e.key==='m'||e.key==='M'){muted=!muted;if(master)master.gain.value=muted?0:.9;const h=$('#hint');h.style.opacity=1;h.textContent=muted?'MUTED':'SOUND ON';setTimeout(()=>{if(playing)h.style.opacity=0},900)}
  if(e.key===' '&&!playing&&$('#start').style.display!=='none'){e.preventDefault();begin()}
});
$('#hint').textContent='';
if(AUTO)begin();
})();
</script>
