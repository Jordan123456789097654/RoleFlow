# Emails the policy update notice when notices/policy-update.id changes on main.
# Bump the id in that file (a new id per notice) in the same commit as the policy change.
name: Policy update notice

on:
  push:
    branches: [main]
    paths:
      - notices/policy-update.id

concurrency:
  group: policy-notice
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "psycopg[binary]" requests

      # Give the website deploy time to finish, so the notice links point at the new text.
      - name: Wait for deploy
        run: sleep 300

      - name: Send notice
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          PLATFORM_URL: https://roleflow.site
        run: |
          NOTICE_ID="$(tr -d '\n' < notices/policy-update.id)"
          python scripts/send_policy_update_email.py --notice-id "$NOTICE_ID"
